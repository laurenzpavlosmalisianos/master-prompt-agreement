<svg xmlns="http://www.w3.org/2000/svg" width="720" height="3060" viewBox="0 0 720 3060" role="img" aria-labelledby="title desc">
  <title id="title">Reviewer-lane evidence lifecycle for narrow displays</title>
  <desc id="desc">A narrow-layout reviewer-lane lifecycle. A coordinator routes an approved evidence packet to bounded reviewers. Their candidate findings remain advisory until the coordinator verifies them against files, sources, and deterministic evidence. Raw reports follow the declared retention rule. At closeout, used, skipped, accepted, rejected, and lane-fit outcomes become structured markers. When a reviewer feedback file already exists as receipt-declared mutable state, the markers pass narrowly scoped structural linting into that non-authoritative project-local record. Otherwise, the markers remain in the ordinary closeout report and no optional file is created ad hoc.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 16 16" markerWidth="15" markerHeight="15" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-blue-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 16 16" markerWidth="15" markerHeight="15" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-green-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 16 16" markerWidth="15" markerHeight="15" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-red-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .outer { fill: #ffffff; stroke: #64748b; stroke-width: 2.5; }
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #334155; }
      .phase { font: 700 28px Arial, Helvetica, sans-serif; fill: #1d4ed8; letter-spacing: 1.2px; }
      .section-title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 30px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 28px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 28px Arial, Helvetica, sans-serif; fill: #475569; }
      .mono { font: 700 28px "SFMono-Regular", Consolas, Menlo, monospace; fill: #111827; }
      .small-bold { font: 700 28px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .success-label { fill: #047857; }
      .plan { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .lane { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
      .finding { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; }
      .validation { fill: #fefce8; stroke: #a16207; stroke-width: 3; }
      .audit { fill: #fff1f2; stroke: #be123c; stroke-width: 2.5; }
      .trigger { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .marker { fill: #fff7ed; stroke: #c2410c; stroke-width: 3; }
      .lint { fill: #fefce8; stroke: #a16207; stroke-width: 3; }
      .record { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; }
      .report { fill: #f1f5f9; stroke: #64748b; stroke-width: 3; }
      .chip { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .blue-line { stroke: #1d4ed8; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .green-line { stroke: #047857; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .red-line { stroke: #be123c; stroke-width: 2.7; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow-red); }
      .no-line { stroke: #1d4ed8; stroke-width: 3; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow-blue); }
      .arrow-blue-fill { fill: #1d4ed8; }
      .arrow-green-fill { fill: #047857; }
      .arrow-red-fill { fill: #be123c; }

      @media (forced-colors: active) {
        .bg, .outer, .plan, .trigger, .lane, .finding, .marker, .validation, .lint, .record, .report, .audit, .chip { fill: Canvas; stroke: CanvasText; }
        .title, .subtitle, .phase, .section-title, .label, .body, .tiny, .mono, .small-bold, .success-label { fill: CanvasText; }
        .blue-line, .green-line, .red-line, .no-line { stroke: CanvasText; }
        .arrow-blue-fill, .arrow-green-fill, .arrow-red-fill { fill: CanvasText; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="3060"/>
  <text class="title" x="40" y="64">Reviewer-Lane Evidence Lifecycle</text>
  <text class="subtitle" x="40" y="106">Bounded review informs a coordinator.</text>
  <text class="subtitle" x="40" y="142">Reviewer output does not become authority.</text>

  <rect class="outer" x="20" y="168" width="680" height="2862" rx="18"/>
  <text class="phase" x="58" y="214">LIVE REVIEW</text>

  <rect class="plan" x="80" y="234" width="560" height="190" rx="14"/>
  <text class="section-title" x="112" y="280">Coordinator Plan</text>
  <text class="body" x="112" y="324">bounded question • approved evidence</text>
  <text class="body" x="112" y="360">packet • clear schema • verifier gate</text>

  <path class="blue-line" d="M360 424 V456"/>
  <text class="small-bold" x="384" y="450">route</text>

  <rect class="lane" x="80" y="466" width="560" height="190" rx="14"/>
  <text class="section-title" x="112" y="512">Bounded Reviewers</text>
  <text class="body" x="112" y="556">local or external, as approved</text>
  <text class="body" x="112" y="592">scoped evidence • advisory output</text>
  <text class="body" x="112" y="628">only</text>

  <path class="blue-line" d="M360 656 V688"/>
  <text class="small-bold" x="384" y="682">report</text>

  <rect class="finding" x="80" y="698" width="560" height="214" rx="14"/>
  <text class="section-title" x="112" y="744">Candidate Findings</text>
  <text class="body" x="112" y="788">claims • evidence pointers</text>
  <text class="body" x="112" y="824">uncertainty • severity</text>
  <text class="body" x="112" y="860">not yet accepted as fact</text>

  <path class="blue-line" d="M360 912 V944"/>
  <text class="small-bold" x="384" y="938">verify</text>

  <rect class="validation" x="80" y="954" width="560" height="220" rx="14"/>
  <text class="section-title" x="112" y="1000">Coordinator Evidence</text>
  <text class="section-title" x="112" y="1038">Validation</text>
  <text class="body" x="112" y="1082">check files • sources • deterministic</text>
  <text class="body" x="112" y="1118">evidence • accept, reject, or defer</text>

  <path class="red-line" d="M640 560 H672 V1280 H646"/>
  <rect class="audit" x="80" y="1196" width="560" height="190" rx="14"/>
  <text class="label" x="112" y="1244">Raw reports follow each lane's</text>
  <text class="label" x="112" y="1280">retention rule.</text>
  <text class="body" x="112" y="1322">Retained reports are audit evidence,</text>
  <text class="body" x="112" y="1358">not the primary feedback path.</text>

  <text class="phase" x="58" y="1432">CLOSEOUT</text>
  <text class="phase" x="58" y="1468">AFTER USE OR A PLANNED-LANE SKIP</text>

  <rect class="trigger" x="80" y="1492" width="560" height="236" rx="14"/>
  <text class="section-title" x="112" y="1538">Outcome Trigger</text>
  <text class="body" x="112" y="1582">lane used or skipped • finding</text>
  <text class="body" x="112" y="1618">accepted or rejected</text>
  <text class="body" x="112" y="1654">lane-fit observation</text>
  <text class="body" x="112" y="1690">no mandatory VCS hook</text>

  <path class="blue-line" d="M360 1728 V1760"/>
  <text class="small-bold" x="384" y="1754">emit</text>

  <rect class="marker" x="80" y="1770" width="560" height="388" rx="14"/>
  <text class="section-title" x="112" y="1818">Structured Markers</text>
  <rect class="chip" x="112" y="1838" width="496" height="50" rx="7"/>
  <text class="mono" x="128" y="1873">REVIEWER_LANE_USED</text>
  <rect class="chip" x="112" y="1896" width="496" height="50" rx="7"/>
  <text class="mono" x="128" y="1931">REVIEWER_LANE_SKIPPED</text>
  <rect class="chip" x="112" y="1954" width="496" height="50" rx="7"/>
  <text class="mono" x="128" y="1989">REVIEWER_FINDING_ACCEPTED</text>
  <rect class="chip" x="112" y="2012" width="496" height="50" rx="7"/>
  <text class="mono" x="128" y="2047">REVIEWER_FINDING_REJECTED</text>
  <rect class="chip" x="112" y="2070" width="496" height="50" rx="7"/>
  <text class="mono" x="128" y="2105">LANE_FIT_OBSERVATION</text>

  <path class="blue-line" d="M360 2158 V2190"/>
  <text class="small-bold" x="384" y="2184">route</text>

  <rect class="lint" x="80" y="2200" width="560" height="200" rx="14"/>
  <text class="section-title" x="112" y="2248">Feedback File Maintained?</text>
  <text class="body" x="112" y="2292">receipt-declared mutable state only</text>
  <text class="body" x="112" y="2328">choose the applicable closeout branch</text>

  <path class="green-line" d="M360 2400 V2434"/>
  <text class="small-bold success-label" x="384" y="2428">yes</text>

  <rect class="record" x="80" y="2444" width="560" height="268" rx="14"/>
  <text class="section-title" x="112" y="2492">Receipt-Declared Feedback File</text>
  <text class="body" x="112" y="2536">run the structural linter</text>
  <text class="body" x="112" y="2572">fields • enums • refs</text>
  <text class="body" x="112" y="2608">selected leak patterns</text>
  <text class="body" x="112" y="2644">retain a non-authoritative</text>
  <text class="body" x="112" y="2680">project-local record</text>

  <path class="no-line" d="M640 2298 H672 V2836 H646"/>
  <text class="small-bold" x="648" y="2288">no</text>

  <rect class="report" x="80" y="2740" width="560" height="192" rx="14"/>
  <text class="section-title" x="112" y="2788">Ordinary Closeout Report</text>
  <text class="body" x="112" y="2832">retain the applicable markers</text>
  <text class="body" x="112" y="2868">do not create the optional feedback file</text>

  <text class="tiny" x="58" y="2980">Feedback-file lint establishes record validity only.</text>
  <text class="tiny" x="58" y="3016">It does not prove that a reviewer claim is true.</text>
</svg>
