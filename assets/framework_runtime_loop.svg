<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Master Prompt Agreement framework overview</title>
  <desc id="desc">A public overview diagram of the Master Prompt Agreement framework. Canonical authority flows from the Master Service Agreement and project Statement of Work into a generated project contract. The selected runtime entrypoint loads the operative charter, then checks the closed transaction-control set. A present journal, lock, or recovery temp stops ordinary loading and routes bounded inspection plus any permitted exact-ID recovery; a clear gate continues to the project contract, configured authority, relevant state records, the selected runtime task module or full Task Order, and the applicable Practice Guide. Verification combines deterministic checks with semantic and judgment review. Reusable candidate evidence then requires report-only semantic audit, an accepted framework-improvement decision, exact-candidate review, and a verified disposition before a retained change returns to the general framework product context.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 16 16" markerWidth="14" markerHeight="14" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-blue-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 16 16" markerWidth="14" markerHeight="14" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-green-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 16 16" markerWidth="13" markerHeight="13" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-red-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .section-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #111827; }
      .compact-label { font: 700 16px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 16px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .small-bold { font: 700 16px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .clear-label { font: 700 16px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .branch-blue { font: 700 16px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .branch-red { font: 700 16px Arial, Helvetica, sans-serif; fill: #9f1239; }
      .panel { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .authority { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .runtime { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; }
      .verify { fill: #fefce8; stroke: #a16207; stroke-width: 2.5; }
      .feedback { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
      .dark { fill: #0f172a; stroke: #0f172a; stroke-width: 2.5; }
      .dark-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .dark-body { font: 400 16px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .chip { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .guard { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .stop { fill: #fff1f2; stroke: #be123c; stroke-width: 2; }
      .stop-label { font: 700 16px Arial, Helvetica, sans-serif; fill: #9f1239; }
      .blue-line { stroke: #1d4ed8; stroke-width: 2.8; fill: none; marker-end: url(#arrow-blue); }
      .blue-segment { stroke: #1d4ed8; stroke-width: 2.8; fill: none; }
      .green-line { stroke: #047857; stroke-width: 2.8; fill: none; marker-end: url(#arrow-green); }
      .red-line { stroke: #be123c; stroke-width: 2.4; fill: none; marker-end: url(#arrow-red); }
      .soft-line { stroke: #64748b; stroke-width: 2.4; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow-blue); }
      .arrow-blue-fill { fill: #1d4ed8; }
      .arrow-green-fill { fill: #047857; }
      .arrow-red-fill { fill: #be123c; }

      @media (forced-colors: active) {
        .bg, .panel, .authority, .runtime, .verify, .feedback, .dark, .chip, .guard, .stop { fill: Canvas; stroke: CanvasText; }
        .title, .subtitle, .section-title, .label, .compact-label, .body, .tiny, .small-bold, .clear-label, .branch-blue, .branch-red, .dark-title, .dark-body, .stop-label { fill: CanvasText; }
        .blue-line, .blue-segment, .green-line, .red-line, .soft-line { stroke: CanvasText; }
        .arrow-blue-fill, .arrow-green-fill, .arrow-red-fill { fill: CanvasText; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="720"/>
  <text class="title" x="56" y="60">Master Prompt Agreement</text>
  <text class="subtitle" x="56" y="90">A file-backed operating model for coding agents: authority, scope, source discipline, verification, and continuous improvement.</text>

  <rect class="panel" x="48" y="112" width="1184" height="558" rx="16"/>

  <rect class="authority" x="72" y="150" width="280" height="410" rx="12"/>
  <text class="section-title" x="96" y="182">Authority Layers</text>
  <rect class="chip" x="96" y="198" width="232" height="66" rx="9"/>
  <text class="label" x="116" y="224">Agreement</text>
  <text class="body" x="116" y="248">MSA • universal doctrine</text>
  <path class="blue-line" d="M212 268 V282"/>
  <rect class="chip" x="96" y="286" width="232" height="80" rx="9"/>
  <text class="label" x="116" y="313">Statement of Work</text>
  <text class="body" x="116" y="338">SOW • scope +</text>
  <text class="body" x="116" y="359">delegated values</text>
  <path class="blue-line" d="M212 370 V382"/>
  <rect class="chip" x="96" y="386" width="232" height="82" rx="9"/>
  <text class="label" x="116" y="414">Project contract</text>
  <text class="body" x="116" y="438">checked projection;</text>
  <text class="body" x="116" y="459">SOW governs</text>
  <text class="tiny" x="96" y="496">Task Orders and Practice Guides</text>
  <text class="tiny" x="96" y="518">are procedural only; they never</text>
  <text class="tiny" x="96" y="540">override the MSA or project SOW.</text>

  <rect class="runtime" x="392" y="150" width="276" height="430" rx="12"/>
  <text class="section-title" x="416" y="182">Runtime Loading</text>
  <text class="body" x="416" y="209">Core first; route the rest.</text>
  <text class="small-bold" x="416" y="238">required load</text>
  <rect class="chip" x="416" y="248" width="236" height="40" rx="8"/>
  <text class="compact-label" x="436" y="275">entrypoint + charter</text>
  <rect class="guard" x="416" y="300" width="236" height="42" rx="8"/>
  <text class="compact-label" x="436" y="327">transaction-control gate</text>
  <path class="red-line" d="M652 321 H728 V338 H736"/>
  <text class="branch-red" x="704" y="306" text-anchor="middle">present</text>
  <rect class="stop" x="740" y="300" width="172" height="78" rx="9"/>
  <text class="stop-label" x="826" y="329" text-anchor="middle">stop + inspect</text>
  <text class="stop-label" x="826" y="354" text-anchor="middle">recover if permitted</text>
  <path class="blue-line" d="M534 342 V352"/>
  <text class="clear-label" x="546" y="356">clear</text>
  <rect class="chip" x="416" y="360" width="236" height="40" rx="8"/>
  <text class="compact-label" x="436" y="387">contract + authority if set</text>
  <text class="small-bold" x="416" y="430">loaded by relevance</text>
  <rect class="chip" x="416" y="440" width="236" height="38" rx="8"/>
  <text class="compact-label" x="436" y="465">relevant state records</text>
  <rect class="chip" x="416" y="488" width="236" height="48" rx="8"/>
  <text class="compact-label" x="436" y="508">runtime task module</text>
  <text class="compact-label" x="436" y="529">or full Task Order</text>
  <rect class="chip" x="416" y="544" width="236" height="28" rx="8"/>
  <text class="compact-label" x="436" y="564">applicable practice guide</text>

  <rect class="dark" x="752" y="160" width="220" height="134" rx="12"/>
  <text class="dark-title" x="776" y="190">Agent Work</text>
  <text class="dark-body" x="776" y="214">scope • inspect</text>
  <text class="dark-body" x="776" y="236">implement • review</text>
  <text class="dark-body" x="776" y="258">ask on missing authority</text>
  <text class="dark-body" x="776" y="280">report evidence</text>

  <rect class="verify" x="752" y="400" width="220" height="142" rx="12"/>
  <text class="section-title" x="776" y="431">Verification</text>
  <text class="body" x="776" y="450">deterministic checks</text>
  <text class="body" x="776" y="470">semantic and</text>
  <text class="body" x="776" y="490">judgment review</text>
  <text class="body" x="776" y="510">sync • schema • links</text>
  <text class="body" x="776" y="530">release gates</text>

  <rect class="feedback" x="1000" y="150" width="208" height="398" rx="12"/>
  <text class="section-title" x="1024" y="182">Framework</text>
  <text class="section-title" x="1024" y="205">Admission</text>
  <text class="body" x="1024" y="250">candidate evidence</text>
  <text class="body" x="1024" y="288">semantic audit</text>
  <text class="body" x="1024" y="326">accepted improvement</text>
  <text class="body" x="1024" y="364">exact-candidate review</text>
  <text class="body" x="1024" y="402">verified disposition</text>
  <text class="tiny" x="1024" y="458">Project-local work stays</text>
  <text class="tiny" x="1024" y="480">on its project route.</text>

  <rect class="feedback" x="72" y="594" width="280" height="50" rx="9"/>
  <text class="compact-label" x="96" y="625">Retained framework product</text>

  <path class="blue-line" d="M352 350 H378"/>
  <path class="blue-line" d="M668 224 H738"/>
  <text class="small-bold" x="680" y="209">loaded</text>
  <path class="blue-segment" d="M956 294 V328"/>
  <path class="blue-line" d="M956 364 V386"/>
  <text class="branch-blue" x="956" y="352" text-anchor="middle">evidence</text>
  <path class="green-line" d="M972 471 H986"/>
  <path class="soft-line" d="M1104 548 V620 H366"/>
  <text class="tiny" x="570" y="646">retained change returns to framework context</text>
</svg>
