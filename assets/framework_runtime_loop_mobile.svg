<svg xmlns="http://www.w3.org/2000/svg" width="720" height="3000" viewBox="0 0 720 3000" role="img" aria-labelledby="title desc">
  <title id="title">Master Prompt Agreement framework overview for narrow displays</title>
  <desc id="desc">A narrow-layout overview of the Master Prompt Agreement framework. Canonical authority flows from the Master Service Agreement and project Statement of Work into a generated project contract. The selected runtime entrypoint loads the operative charter, then checks the closed transaction-control set. A present journal, lock, or recovery temp stops ordinary loading and routes bounded inspection plus any permitted exact-ID recovery; a clear gate continues to the project contract, configured authority, relevant state records, the selected runtime task module or full Task Order, and the applicable Practice Guide. Verification combines deterministic checks with semantic and judgment review. Reusable candidate evidence then requires report-only semantic audit, an accepted framework-improvement decision, exact-candidate review, and a verified disposition before a retained change returns to the general framework product context.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 16 16" markerWidth="15" markerHeight="15" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-blue-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 16 16" markerWidth="15" markerHeight="15" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-green-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 16 16" markerWidth="15" markerHeight="15" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path class="arrow-red-fill" d="M1,2 L15,8 L1,14 Z"/>
    </marker>
    <style>
      .bg { fill: #f6f8fb; }
      .outer { fill: #ffffff; stroke: #64748b; stroke-width: 2.5; }
      .title { font: 700 44px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #334155; }
      .section-title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .label { font: 700 30px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 28px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 400 28px Arial, Helvetica, sans-serif; fill: #475569; }
      .small-bold { font: 700 28px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .clear-label { font: 700 28px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
      .authority { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
      .runtime { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
      .work { fill: #0f172a; stroke: #0f172a; stroke-width: 3; }
      .verify { fill: #fefce8; stroke: #a16207; stroke-width: 3; }
      .learn { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; }
      .chip { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .guard { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; }
      .clear { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
      .stop { fill: #fff1f2; stroke: #be123c; stroke-width: 2.5; }
      .dark-title { font: 700 34px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .dark-body { font: 400 28px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .stop-label { font: 700 28px Arial, Helvetica, sans-serif; fill: #9f1239; }
      .blue-line { stroke: #1d4ed8; stroke-width: 3.2; fill: none; marker-end: url(#arrow-blue); }
      .green-line { stroke: #047857; stroke-width: 3.2; fill: none; marker-end: url(#arrow-green); }
      .red-line { stroke: #be123c; stroke-width: 3; fill: none; marker-end: url(#arrow-red); }
      .soft-line { stroke: #64748b; stroke-width: 3; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow-blue); }
      .arrow-blue-fill { fill: #1d4ed8; }
      .arrow-green-fill { fill: #047857; }
      .arrow-red-fill { fill: #be123c; }

      @media (forced-colors: active) {
        .bg, .outer, .authority, .runtime, .work, .verify, .learn, .chip, .guard, .clear, .stop { fill: Canvas; stroke: CanvasText; }
        .title, .subtitle, .section-title, .label, .body, .tiny, .small-bold, .clear-label, .dark-title, .dark-body, .stop-label { fill: CanvasText; }
        .blue-line, .green-line, .red-line, .soft-line { stroke: CanvasText; }
        .arrow-blue-fill, .arrow-green-fill, .arrow-red-fill { fill: CanvasText; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="3000"/>
  <text class="title" x="40" y="64">Master Prompt Agreement</text>
  <text class="subtitle" x="40" y="106">A file-backed operating model for coding agents.</text>
  <text class="subtitle" x="40" y="142">Authority • scoped work • verification • learning.</text>

  <rect class="outer" x="20" y="168" width="680" height="2802" rx="18"/>

  <rect class="authority" x="80" y="196" width="560" height="612" rx="14"/>
  <text class="section-title" x="112" y="244">Authority Layers</text>
  <rect class="chip" x="112" y="264" width="496" height="90" rx="10"/>
  <text class="label" x="136" y="302">Agreement</text>
  <text class="body" x="136" y="338">MSA • universal doctrine</text>
  <path class="blue-line" d="M360 358 V378"/>
  <rect class="chip" x="112" y="386" width="496" height="108" rx="10"/>
  <text class="label" x="136" y="426">Statement of Work</text>
  <text class="body" x="136" y="466">SOW • scope and delegated values</text>
  <path class="blue-line" d="M360 498 V518"/>
  <rect class="chip" x="112" y="526" width="496" height="100" rx="10"/>
  <text class="label" x="136" y="566">Project contract</text>
  <text class="body" x="136" y="606">checked projection; SOW governs</text>
  <text class="tiny" x="112" y="666">Task Orders and Practice Guides</text>
  <text class="tiny" x="112" y="702">are procedural; they never override</text>
  <text class="tiny" x="112" y="738">the Agreement or project SOW.</text>

  <path class="blue-line" d="M360 808 V838"/>
  <text class="small-bold" x="384" y="836">projected</text>

  <rect class="runtime" x="80" y="852" width="560" height="904" rx="14"/>
  <text class="section-title" x="112" y="904">Runtime Loading</text>
  <text class="body" x="112" y="946">Required surfaces; routed as needed.</text>
  <text class="small-bold" x="112" y="992">required load</text>
  <rect class="chip" x="112" y="1010" width="496" height="72" rx="10"/>
  <text class="label" x="136" y="1056">entrypoint + charter</text>
  <rect class="guard" x="112" y="1100" width="496" height="72" rx="10"/>
  <text class="label" x="136" y="1146">transaction control present?</text>

  <path class="blue-line" d="M360 1172 V1190 H206 V1202"/>
  <path class="red-line" d="M360 1172 V1190 H468 V1202"/>
  <text class="stop-label" x="500" y="1198">present</text>
  <rect class="clear" x="112" y="1210" width="188" height="74" rx="10"/>
  <text class="clear-label" x="206" y="1258" text-anchor="middle">clear</text>
  <rect class="stop" x="328" y="1210" width="280" height="108" rx="10"/>
  <text class="stop-label" x="468" y="1250" text-anchor="middle">stop + inspect</text>
  <text class="stop-label" x="468" y="1286" text-anchor="middle">recover if permitted</text>

  <path class="blue-line" d="M206 1284 V1330"/>
  <rect class="chip" x="112" y="1338" width="496" height="72" rx="10"/>
  <text class="label" x="136" y="1384">contract + authority if set</text>
  <text class="small-bold" x="112" y="1444">loaded by relevance</text>
  <rect class="chip" x="112" y="1462" width="496" height="68" rx="10"/>
  <text class="label" x="136" y="1506">relevant state records</text>
  <rect class="chip" x="112" y="1550" width="496" height="100" rx="10"/>
  <text class="label" x="136" y="1590">runtime task module</text>
  <text class="label" x="136" y="1626">or full Task Order</text>
  <rect class="chip" x="112" y="1668" width="496" height="72" rx="10"/>
  <text class="label" x="136" y="1714">applicable practice guide</text>

  <path class="blue-line" d="M360 1756 V1786"/>
  <text class="small-bold" x="384" y="1782">loaded</text>

  <rect class="work" x="80" y="1800" width="560" height="230" rx="14"/>
  <text class="dark-title" x="112" y="1852">Agent Work</text>
  <text class="dark-body" x="112" y="1894">scope • inspect • implement or assess</text>
  <text class="dark-body" x="112" y="1930">review • ask when authority is missing</text>
  <text class="dark-body" x="112" y="1966">report acceptance evidence</text>

  <path class="blue-line" d="M360 2030 V2060"/>
  <text class="small-bold" x="384" y="2056">evidence</text>

  <rect class="verify" x="80" y="2074" width="560" height="238" rx="14"/>
  <text class="section-title" x="112" y="2126">Verification</text>
  <text class="body" x="112" y="2168">deterministic checks: sync • schema</text>
  <text class="body" x="112" y="2204">links • target and adjacent evidence</text>
  <text class="body" x="112" y="2240">semantic and judgment review</text>

  <path class="green-line" d="M360 2312 V2342"/>

  <rect class="learn" x="80" y="2356" width="560" height="410" rx="14"/>
  <text class="section-title" x="112" y="2408">Framework Change Admission</text>
  <text class="body" x="112" y="2454">candidate evidence</text>
  <text class="body" x="112" y="2492">semantic audit</text>
  <text class="body" x="112" y="2530">accepted improvement</text>
  <text class="body" x="112" y="2568">exact-candidate review</text>
  <text class="body" x="112" y="2606">verified disposition</text>
  <text class="tiny" x="112" y="2652">Project-local changes stay on</text>
  <text class="tiny" x="112" y="2688">their project route.</text>
  <text class="tiny" x="112" y="2724">Evidence informs change, not authority.</text>

  <path class="soft-line" d="M360 2766 V2806"/>
  <text class="small-bold" x="384" y="2800">retained</text>

  <rect class="learn" x="80" y="2820" width="560" height="140" rx="14"/>
  <text class="section-title" x="112" y="2866">Retained Framework Product</text>
  <text class="body" x="112" y="2910">verified change returns to</text>
  <text class="body" x="112" y="2944">framework context</text>
</svg>
